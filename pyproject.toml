[project]
name = "robin"
version = "0.1.0"
description = "Local workspace for running, observing, and coordinating coding agents"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "mcp>=2.3",
]

[project.scripts]
robin = "robin.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: long-running tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
extend-exclude = ["supervisor", "corpus"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/robin/store/migrations/versions/*" = ["E501"]  # frozen DDL

[tool.mypy]
files = ["src"]
python_version = "3.13"
check_untyped_defs = true
plugins = ["pydantic.mypy"]
