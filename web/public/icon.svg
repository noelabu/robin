<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a3adf8"/>
      <stop offset="1" stop-color="#7555cc"/>
    </linearGradient>
    <mask id="cut" maskUnits="userSpaceOnUse" x="-12" y="-12" width="24" height="24">
      <rect x="-12" y="-12" width="24" height="24" fill="#fff"/>
      <circle r="2.6" fill="#000"/>
      <g stroke="#000" stroke-width="0.8"><line x1="-1.176" y1="-1.618" x2="-5.290" y2="-7.281"/><line x1="-1.902" y1="0.618" x2="-8.560" y2="2.781"/><line x1="-0.000" y1="2.000" x2="-0.000" y2="9.000"/><line x1="1.902" y1="0.618" x2="8.560" y2="2.781"/><line x1="1.176" y1="-1.618" x2="5.290" y2="-7.281"/></g>
    </mask>
